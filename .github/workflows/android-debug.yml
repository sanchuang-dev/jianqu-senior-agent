name: Android prototype APK (debug)

on:
  pull_request:
    branches: [dev, test, prod]
  push:
    branches: [dev, test, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jianqu-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests, lint and build debug APK
        run: bash ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - name: Record artifact fingerprint
        shell: bash
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/debug
          test -s app-debug.apk
          sha256sum app-debug.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo 'ANDROID_DEBUG_BUILD_ONLY=true' >> "$GITHUB_STEP_SUMMARY"
          echo 'Debug APK is not a signed release nor evidence of device acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: jianqu-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
