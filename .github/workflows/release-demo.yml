# Public-repository prototype release. No signing secrets or private artifact relay.
# Create a tag only after approved JQ source has been promoted through test -> prod.
name: Publish Jianqu prototype prerelease

on:
  push:
    tags:
      - 'jianqu-demo-v*'

permissions:
  contents: write

concurrency:
  group: jianqu-public-release
  cancel-in-progress: false

jobs:
  prerelease:
    if: github.repository == 'sanchuang-dev/jianqu-senior-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tag on exact prod commit
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          sha="$(git rev-parse HEAD)"
          short="${sha:0:7}"
          [[ "$tag" =~ ^jianqu-demo-v[0-9]+\.[0-9]+\.[0-9]+-[a-f0-9]{7}$ ]] || exit 1
          [[ "$tag" == *-"$short" ]] || { echo '::error::Tag does not match source commit'; exit 1; }
          git fetch --no-tags origin +refs/heads/prod:refs/remotes/origin/prod
          [[ "$sha" == "$(git rev-parse origin/prod)" ]] || {
            echo '::error::Only accepted prod HEAD can be published'; exit 1;
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and lint
        shell: bash
        run: bash ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:lintDebug --console=plain
      - name: Verify APK bytes and fingerprint
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          size=$(stat -c '%s' "$apk")
          (( size > 100000 && size < 100000000 ))
          cp "$apk" "$RUNNER_TEMP/jianqu-demo.apk"
          ( cd "$RUNNER_TEMP"; sha256sum jianqu-demo.apk | tee SHA256SUMS.txt )
      - name: Publish public, clearly labeled prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME"             "$RUNNER_TEMP/jianqu-demo.apk#jianqu-demo.apk"             "$RUNNER_TEMP/SHA256SUMS.txt#SHA256SUMS.txt"             --repo "$GITHUB_REPOSITORY"             --verify-tag             --prerelease             --title "闺蜜机 / 小暖 · $GITHUB_REF_NAME (Android debug prototype)"             --notes "纯本地模拟原型；无真实 AI、后台或支付。APK 使用 GitHub runner 的 Debug 签名，不保证后续覆盖升级。需要安装时请明确知晓其演示性质。构建成功不代表设备验收通过。"
